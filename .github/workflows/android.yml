name: Android CI

on:
  push:
    branches: [ main, 'claude/**' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # Checks any committed gradle-wrapper.jar against Gradle's published checksums.
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # ubuntu-latest ships Gradle; use it to (re)generate the full wrapper
      # (including gradle-wrapper.jar) so ./gradlew works for all later steps.
      # Pinned to 8.x: AGP 8.7 does not support Gradle 9.
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.10.2 --distribution-type bin

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Lint
        run: ./gradlew lintDebug

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v5
        with:
          name: LabelScanner-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: app/build/reports/tests/testDebugUnitTest/

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html

  release:
    name: Create Release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Download debug APK from the build job
        uses: actions/download-artifact@v5
        with:
          name: LabelScanner-debug
          path: apk

      - name: Stage release assets under a stable filename
        run: |
          mkdir -p release
          cp apk/*.apk release/LabelScanner-debug.apk

      - name: Compute release tag
        id: tag
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          echo "tag=v${version}-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # The QR code encodes GitHub's stable "latest release" download URL, not
      # this run's own tag — so the same QR code (screenshot it once) always
      # resolves to whatever build is newest, forever, as long as the asset
      # filename stays "LabelScanner-debug.apk".
      - name: Generate QR code for the APK download link
        env:
          APK_URL: https://github.com/${{ github.repository }}/releases/latest/download/LabelScanner-debug.apk
        run: |
          pip install --quiet qrcode[pil]
          python - <<'PY'
          import os
          import qrcode
          url = os.environ["APK_URL"]
          qrcode.make(url).save("release/qr-code.png")
          print(f"QR encodes: {url}")
          PY

      - name: Write release notes header
        env:
          APK_URL: https://github.com/${{ github.repository }}/releases/latest/download/LabelScanner-debug.apk
          QR_URL: https://github.com/${{ github.repository }}/releases/download/${{ steps.tag.outputs.tag }}/qr-code.png
        run: |
          cat > release/notes.md <<EOF
          Scan to install the latest debug build:

          ![Download QR code]($QR_URL)

          Direct link: $APK_URL

          This is an unsigned debug APK built automatically from \`main\`. Install
          only on devices you own or are authorized to test.
          EOF

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.tag.outputs.tag }}" \
            release/LabelScanner-debug.apk \
            release/qr-code.png \
            --title "Label Scanner ${{ steps.tag.outputs.tag }}" \
            --notes-file release/notes.md \
            --generate-notes
